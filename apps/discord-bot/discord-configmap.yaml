apiVersion: v1
kind: ConfigMap
metadata:
  name: discord-config
data:
  # Legacy GroupMe bridge channel; see discord-ids.yaml.
  MONITOR_CHANNEL_ID: "$(BOT_TEST_CHANNEL_ID)"
  API_PORT: "3000"
  # IEEE TAMU guild; see discord-ids.yaml.
  GUILD_ID: "$(IEEE_TAMU_GUILD_ID)"
  CALENDAR_ICS_URL: https://portal.ieeetamu.org/api/v1/calendar
  # All routes currently go to #officer-bot-notifications; see discord-ids.yaml.
  NOTIFY_ROUTES: "portal-events:$(OFFICER_BOT_NOTIFICATIONS_CHANNEL_ID),homepage-contact:$(OFFICER_BOT_NOTIFICATIONS_CHANNEL_ID),default:$(OFFICER_BOT_NOTIFICATIONS_CHANNEL_ID)"
  MUSIC_AGENT_URL: "http://192.168.1.10:8787"
  # Comma-separated role IDs allowed to control playback. When empty, only
  # members with the Manage Server permission can use the music commands.
  MUSIC_ALLOWED_ROLE_IDS: "$(OFFICER_ROLE_ID)"
  # Optional comma-separated channel IDs where music commands are allowed.
  MUSIC_ALLOWED_CHANNEL_IDS: ""
  MUSIC_COOLDOWN_SECONDS: "0"
  # Brother MFC-7360N print control API on ieee-tamu-5B.
  PRINT_AGENT_URL: "http://192.168.1.10:8788"
  # Comma-separated role IDs allowed to print. When empty, only members with
  # the Manage Server permission can use the print commands.
  PRINT_ALLOWED_ROLE_IDS: "$(OFFICER_ROLE_ID)"
  # Optional comma-separated channel IDs where print commands are allowed.
  PRINT_ALLOWED_CHANNEL_IDS: ""
  PRINT_COOLDOWN_SECONDS: "5"
  PRINT_MAX_FILE_MB: "10"
  # Bambu Lab X2D control API on ieee-tamu-5B.
  BAMBU_AGENT_URL: "http://192.168.1.10:8789"
  # Comma-separated role IDs allowed to use the 3D printer. When empty, only
  # members with the Manage Server permission can use the 3D printer commands.
  BAMBU_ALLOWED_ROLE_IDS: "$(OFFICER_ROLE_ID),$(PROJECTS_TEAM_ROLE_ID)"
  # Optional comma-separated channel IDs where 3D printer commands are allowed.
  BAMBU_ALLOWED_CHANNEL_IDS: ""
  BAMBU_COOLDOWN_SECONDS: "10"
  BAMBU_MAX_FILE_MB: "25"
  # officer-bot-notifications: post a snapshot when a 3D print finishes/fails.
  BAMBU_NOTIFY_CHANNEL_ID: "$(OFFICER_BOT_NOTIFICATIONS_CHANNEL_ID)"
  BAMBU_NOTIFY_POLL_SECONDS: "20"
  # ESP32 lounge light sensor. The bot keeps one minimal presence embed updated
  # in this channel and marks the sensor offline after a missed heartbeat window.
  OFFICER_STATUS_CHANNEL_ID: "$(OFFICER_HOURS_CHANNEL_ID)"
  OFFICER_STATUS_STALE_SECONDS: "90"
