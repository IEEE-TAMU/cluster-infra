apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord
spec:
  selector:
    matchLabels:
      app: discord
  replicas: 1
  template:
    metadata:
      labels:
        app: discord
      annotations:
        # Bump this when discord-config changes so pods pick up new env vars.
        ieee-tamu.org/config-revision: "2026-11-23-officer-status"
    spec:
      containers:
        - name: discord
          image: ghcr.io/ieee-tamu/discord-bot:0.2.14
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: discord-config
            - secretRef:
                name: discord-secrets
