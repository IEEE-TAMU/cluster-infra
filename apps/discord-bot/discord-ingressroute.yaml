apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: discord-officer-status
spec:
  routes:
    # The ESP32 posts to http://192.168.1.10/officer-status on the lounge LAN.
    # Matching the LAN IP keeps this off the public Cloudflare tunnel: requests
    # for discord.ieeetamu.org do not match and return 404. The bearer API key is
    # still required on the LAN.
    - match: Host(`192.168.1.10`) && Path(`/officer-status`)
      kind: Rule
      services:
        - name: discord
          port: 3000
