apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discord-api-ingress
spec:
  podSelector:
    matchLabels:
      app: discord
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portal
          podSelector:
            matchLabels:
              app: portal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
          podSelector:
            matchLabels:
              app: homepage
        # Traefik exposes only /officer-status outside the cluster, for the
        # ESP32 lounge button.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
