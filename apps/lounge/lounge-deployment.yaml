apiVersion: apps/v1
kind: Deployment
metadata:
  name: lounge
spec:
  selector:
    matchLabels:
      app: lounge
  replicas: 1
  template:
    metadata:
      labels:
        app: lounge
    spec:
      containers:
        - name: lounge
          image: ghcr.io/ieee-tamu/lounge:0.2.1
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: lounge-config
            - secretRef:
                name: lounge-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
