apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic-worker
spec:
  selector:
    matchLabels:
      app: mautic-worker
  # Scaled to 0 since 2026-10-21 for PHP2Shell (CVE-2026-109618 /
  # CVE-2026-109619). No patched 7.1.x image was published; the only fixed
  # build is 7.2.1-apache, and a 7.2 upgrade previously broke this instance.
  # Staying down until that migration is validated.
  replicas: 0
  template:
    metadata:
      labels:
        app: mautic-worker
    spec:
      containers:
        - name: mautic-worker
          image: mautic/mautic:7.1.2-apache
          envFrom:
            - configMapRef:
                name: mautic-config
            - secretRef:
                name: mautic-secrets
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_worker
          volumeMounts:
            - name: mautic-data
              mountPath: /var/www/html/config
              subPath: config
            - name: mautic-data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: mautic-data
              mountPath: /var/www/html/docroot/media/files
              subPath: media-files
            - name: mautic-data
              mountPath: /var/www/html/docroot/media/images
              subPath: media-images
            - name: mautic-data
              mountPath: /var/www/html/docroot/translations
              subPath: translations
      volumes:
        - name: mautic-data
          persistentVolumeClaim:
            claimName: mautic-pvc
