apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink
spec:
  selector:
    matchLabels:
      app: shlink
  replicas: 1 # You could also consider elastic scaling for this deployment
  template:
    metadata:
      labels:
        app: shlink
    spec:
      containers:
        - name: shlink
          image: shlinkio/shlink:5.1.8
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shlink-config
            - secretRef:
                name: shlink-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Availability boundary for the memory_limit=-1 PHP2Shell mitigation.
              memory: 768Mi
          volumeMounts:
            - name: php-hardening
              mountPath: /usr/local/etc/php/conf.d/zz-php2shell.ini
              subPath: zz-php2shell.ini
            - name: roadrunner-config
              mountPath: /etc/shlink/config/roadrunner/.rr.yml
              subPath: .rr.yml
      volumes:
        - name: php-hardening
          configMap:
            name: shlink-hardening
            items:
              - key: php2shell.ini
                path: zz-php2shell.ini
        - name: roadrunner-config
          configMap:
            name: shlink-hardening
            items:
              - key: rr.yml
                path: .rr.yml
