# Interim hardening for PHP2Shell (CVE-2026-109618 / CVE-2026-109619).
# The image runs PHP 8.5.7; the fixes land in PHP 8.5.12.
# Remove this ConfigMap and its mounts once the image is rebuilt on 8.5.12+.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shlink-hardening
data:
  # Loaded from PHP_INI_DIR/conf.d, after the image's own php.ini.
  php2shell.ini: |
    ; CVE-2026-109618: keep PHP's out-of-memory handler from running on
    ; attacker-influenced allocations. Availability is bounded by the
    ; container memory limit in the Deployment instead.
    memory_limit = -1

    ; CVE-2026-109619: do not carry request-owned state between requests.
    ; Blocks the confirmed session upload progress path.
    session.upload_progress.enabled = 0

    ; PHP 8.5 only: blocks the confirmed fatal backtrace path.
    fatal_error_backtraces = 0

    ; Shlink's bundled php.ini enables assertions in production. Strip them so
    ; an assertion failure cannot become an attacker-reachable fatal error.
    zend.assertions = -1
  # Copied from shlink v5.1.7 (config/roadrunner/.rr.yml) with the HTTP pool
  # max_jobs lowered from 250 to 10. RoadRunner workers are long-lived, so
  # recycling them often limits how many requests can observe stale state from
  # a previous request (CVE-2026-109619). Re-sync with upstream on upgrade, or
  # drop this override entirely once the PHP 8.5.12 build is deployed.
  rr.yml: |
    version: '3'

    rpc:
      listen: tcp://127.0.0.1:6001

    server:
      command: 'php -dopcache.enable_cli=1 -dopcache.validate_timestamps=0 ../../bin/roadrunner-worker.php'

    http:
      address: '${ADDRESS:-0.0.0.0}:${PORT:-8080}'
      middleware: ['static']
      static:
        dir: '../../public'
        forbid: ['.php', '.htaccess']
      pool:
        num_workers: ${WEB_WORKER_NUM:-0}
        max_jobs: 10

    jobs:
      timeout: 300 # 5 minutes
      pool:
        num_workers: ${TASK_WORKER_NUM:-0}
        max_jobs: 250 # Restart worker after processing this amount of jobs to mitigate memory leaks
      consume: ['shlink']
      pipelines:
        shlink:
          driver: memory
          config:
            priority: 10
            prefetch: 10

    logs:
      encoding: ${LOGS_FORMAT:-console}
      mode: production
      channels:
        http:
          mode: 'off' # Disable logging as Shlink handles it internally
        server:
          encoding: ${LOGS_FORMAT:-console}
          level: info
        jobs:
          encoding: ${LOGS_FORMAT:-console}
          level: debug
