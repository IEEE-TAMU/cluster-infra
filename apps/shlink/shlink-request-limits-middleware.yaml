# Reject oversized request bodies at the proxy before they reach the app.
# Shlink only accepts small JSON payloads, so 1 MiB is generous. Kept after the
# PHP2Shell patch because it costs nothing and caps a whole class of abuse.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: shlink-request-limits
spec:
  buffering:
    maxRequestBodyBytes: 1048576
    memRequestBodyBytes: 1048576
